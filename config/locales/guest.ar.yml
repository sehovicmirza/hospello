      privacy_notice:
        title: "إشعار الخصوصية"
        pending_review_marker: "مسودة — قيد المراجعة القانونية"
        body: "نستخدم اسمك ورقم غرفتك ورسائلك لمساعدة طاقم الفندق على خدمتك أثناء إقامتك. رقم هاتفك، إذا قدمته، يُستخدم فقط للتواصل معك بشأن إقامتك. نحتفظ بمحادثتك — اسمك وغرفتك وكل ما كتبه الطرفان — لمدة 90 يوماً بعد انتهاء إقامتك، ثم نحذفها. أما سجل ما طلبته من الطاقم فيُحفظ لمدة 365 يوماً لأغراض تشغيل الفندق، مع إزالة اسمك وغرفتك وكلماتك منه بعد 90 يوماً. لا تُباع هذه المعلومات ولا تُشارك خارج الفندق وHospello. وإذا رغبت في حذفها قبل ذلك، أخبر مكتب الاستقبال."
      unavailable:
        title: "هذا الفندق لا يستقبل محادثات النزلاء حالياً"
