      # Two independently-pluralized clauses, each driven by its own count
      # rather than string surgery — see Staff::RoomsController
      # #bulk_create_notice. Bosnian properly distinguishes three plural
      # forms (1 / 2-4 / 5+), and I18n's default backend, same as every
      # other count: key in this file, only distinguishes "one" vs "other"
      # — so "2 sobe dodano" is closer to correct than "2 soba dodano"
      # would be, but "other" here is deliberately the 5+ form rather than
      # a fully accurate 2-4 form. Correctness (never a wrong number) does
      # not depend on this; only how natural counts of 2-4 read do.
      bulk_create:
        created_phrase:
          one: "1 soba dodana"
          few: "%{count} sobe dodane"
          other: "%{count} soba dodano"
        skipped_phrase:
          one: "1 preskočena kao duplikat"
          few: "%{count} preskočene kao duplikati"
          other: "%{count} preskočeno kao duplikat"
        refused_phrase:
          one: "Još 1 nije dodata: vaš plan pokriva do %{limit} soba."
          few: "Još %{count} nisu dodate: vaš plan pokriva do %{limit} soba."
          other: "Još %{count} nije dodato: vaš plan pokriva do %{limit} soba."
        summary: "%{created_phrase}, %{skipped_phrase}."
