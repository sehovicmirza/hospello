test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 — S3-compatible, 10GB free, no egress fees. Hotel logos and
# welcome images are kilobytes, so a pilot fits comfortably in the free tier.
# Selected in production with ACTIVE_STORAGE_SERVICE=r2; credentials come from
# the environment, never from the repo.
r2:
  service: S3
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  region: auto
  force_path_style: true
