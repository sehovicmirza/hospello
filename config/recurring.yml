# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Ops::HeartbeatJob runs from the queue, not from a web request, precisely
  # so a dead job pipeline behind a healthy web process stops pinging and the
  # external monitor pages someone — see the job for why.
  ops_heartbeat:
    class: Ops::HeartbeatJob
    queue: low
    schedule: every 5 minutes

  ops_queue_health:
    class: Ops::QueueHealthJob
    queue: low
    schedule: every 10 minutes

  # A guest who abandons a half-finished request mid-conversation must not
  # have it spring to life an hour later — and the draft they left behind
  # holds the one-live-draft slot until it is closed. Every 5 minutes rather
  # than hourly because the window that matters is the guest's own visit.
  expire_service_request_drafts:
    class: ServiceRequests::ExpireDraftsJob
    queue: low
    schedule: every 5 minutes

  # A message left mid-translation because its job died shows the reader
  # "translating…" forever, which is worse than showing them the original.
  # Every minute rather than every five: the budget it enforces is fifteen
  # seconds, and a sweep an order of magnitude slower than its own budget is
  # not really enforcing one.
  settle_overdue_translations:
    class: Ai::TranslationWatchdogJob
    queue: low
    schedule: every minute

  # Later slices add more recurring entries here: escalation reminders, and
  # data-retention purges (Slice 7).
