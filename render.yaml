# Render Blueprint for Hospello.
#
# Defaults are the cheapest configuration that runs the whole product: one web
# service and one Postgres database, both on the free tier, both in Frankfurt
# (Render's European region — guest and hotel data stays in the EU).
#
# What the free tier costs you, and when to upgrade:
#
#   * The web service sleeps after 15 minutes with no traffic and takes roughly
#     a minute to wake. A guest scanning a QR code in a hotel room would wait
#     through that. Fine for demos and development; change `plan: free` to
#     `plan: starter` ($7/mo) before any real hotel pilot.
#   * The free database is deleted 30 days after creation. Change
#     `plan: free` to `plan: basic-256mb` ($6/mo) to keep it, which also
#     unlocks point-in-time recovery.
#   * Background jobs (Solid Queue) run inside the web process, so they sleep
#     with it. On a paid plan they keep running.
#
# Upgrade path, in order: web to `starter`, then move `db:migrate` from
# bin/render-build.sh into `preDeployCommand` below, then database to
# `basic-256mb`, then a separate `worker` service (commented out at the bottom).

services:
  - type: web
    name: hospello
    runtime: ruby
    plan: free # -> starter ($7/mo) before a real pilot: no sleeping, jobs keep running
    region: frankfurt
    branch: main
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    # preDeployCommand: bundle exec rails db:migrate   # paid instance types only
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hospello-db
          property: connectionString

      # Paste the contents of config/master.key (run: cat config/master.key).
      # Rails needs it to decrypt config/credentials.yml.enc.
      - key: RAILS_MASTER_KEY
        sync: false

      # The public hostname guests reach — the BARE host only: no
      # "https://" scheme and no trailing slash. Set it to your Render URL
      # (e.g. hospello.onrender.com) or your custom domain — NOT
      # https://hospello.onrender.com/, even though that scheme-prefixed
      # form is what Render's own dashboard displays for your service, so
      # copy-pasting it is the easy mistake to make here. AppHost strips a
      # stray scheme/trailing slash/whitespace defensively and the app
      # refuses to boot without this set at all, but don't rely on either —
      # get the bare host right here. Printed QR codes encode this host, so
      # changing it later means reprinting.
      - key: APP_HOST
        sync: false

      # First platform administrator, created idempotently by db:seed on first
      # boot. Use a real address and a strong password; change the password
      # after signing in.
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false

      # Anthropic API key — the AI concierge and translation both use it.
      # The app boots and runs without it: guests chat, staff reply, the inbox
      # works, and any AI call degrades to "reception will reply personally".
      - key: ANTHROPIC_API_KEY
        sync: false

      # Model ids. Both have sensible defaults in config/initializers/ai.rb
      # (claude-opus-5 for the concierge, claude-haiku-4-5 for translation);
      # set them here only to override, e.g. to move a hotel onto a cheaper
      # model or to roll forward to a new one without a deploy.
      # - key: AI_MODEL
      #   value: claude-opus-5
      # - key: TRANSLATION_MODEL
      #   value: claude-haiku-4-5

      # --- WhatsApp (Slice 6) ---------------------------------------------
      #
      # All four are optional in the same sense ANTHROPIC_API_KEY is: the app
      # boots and every hotel's QR web chat works with none of them set. What
      # stops working is WhatsApp specifically, and it stops *visibly* rather
      # than silently — an outbound send raises a named Whatsapp::ApiError
      # and the message is marked failed with a line the receptionist can
      # read (see Whatsapp::SendMessageJob), and an unsigned webhook is
      # refused rather than trusted.
      #
      # Set them only for an instance that actually has a hotel connected to
      # a WhatsApp number; see docs/whatsapp-onboarding.md for where each
      # value comes from and in what order to obtain them.

      # The System User access token from Meta's WhatsApp Manager. This is
      # what authorizes every outbound send.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

      # The App Secret, used to verify the HMAC-SHA256 signature Meta puts on
      # every webhook delivery (Whatsapp::WebhookSignature). **Without it
      # every delivery is refused**, which is the correct failure — an
      # unverifiable webhook is indistinguishable from a forged one.
      - key: WHATSAPP_APP_SECRET
        sync: false

      # A secret this app chooses, then types into Meta's Webhooks
      # configuration. Meta echoes it back once, on the subscription
      # handshake, and never again.
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false

      # Meta's Graph API version. Defaults to the value in
      # config/initializers/whatsapp.rb; set here only to pin or roll forward
      # without a deploy.
      # - key: WHATSAPP_API_VERSION
      #   value: v22.0

      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"

      # Run the Solid Queue supervisor inside Puma — no separate paid worker
      # service at pilot scale. config/puma.rb reads this.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"

      # One Puma worker: the free and starter plans have 512MB of RAM, and the
      # in-process job supervisor needs headroom. Raise to 2 on `standard`.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"

      # Hotel logos and welcome images. config/environments/production.rb
      # resolves this automatically: r2 the instant R2_BUCKET (below) is set,
      # local disk otherwise (its ephemeral container disk means uploads
      # vanish on redeploy — acceptable while evaluating, not for a pilot).
      # Fill in the four R2 variables below to keep uploads (Cloudflare R2:
      # 10GB free, no egress fees). Uncomment only to force one or the other
      # regardless of whether R2_BUCKET is configured.
      # - key: ACTIVE_STORAGE_SERVICE
      #   value: local
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false

      # Optional operations wiring. Every one of these is inert when unset —
      # the app runs fine without them.
      - key: SENTRY_DSN
        sync: false
      - key: HEARTBEAT_URL
        sync: false

databases:
  - name: hospello-db
    plan: free # -> basic-256mb ($6/mo): free databases are deleted after 30 days
    region: frankfurt
    databaseName: hospello
    user: hospello

# Split background jobs onto their own service when the queue starts lagging
